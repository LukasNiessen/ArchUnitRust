name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format, lint, document, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust with quality components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Lint every target and feature
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build API documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --no-deps --locked

      - name: Verify the publishable crate archive
        run: cargo +stable package --locked

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Run the complete test suite
        run: cargo +stable test --workspace --all-features --locked

  architecture:
    name: Dogfood the public architecture API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Check ArchUnitRust with ArchUnitRust
        run: cargo +stable test --test architecture --all-features --locked

  msrv:
    name: Build on Rust 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Check every target and feature on the MSRV
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked
