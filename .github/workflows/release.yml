name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  checks:
    name: Release quality gates
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish and verify archunit
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the source commit and release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust with quality components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update

      - name: Prepare the next version or resume this release
        id: prepare
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          python3 .github/scripts/release.py

      - name: Validate the final versioned archive
        if: steps.prepare.outputs.publish == 'true'
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo +stable test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo +stable doc --workspace --all-features --no-deps --locked
          cargo +stable publish --dry-run --locked

      - name: Record release metadata on main before uploading
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No force push: a newer main commit makes this attempt stop before publishing.
          # GITHUB_TOKEN pushes do not recursively trigger another workflow run.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:main

      - name: Publish the immutable crate archive
        if: steps.prepare.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "The CARGO_REGISTRY_TOKEN repository secret is required." >&2
            exit 1
          fi
          cargo +stable publish --locked

      - name: Install the exact registry version in a standalone project
        run: |
          consumer="$RUNNER_TEMP/archunit-registry-consumer"
          mkdir -p "$consumer"
          cp tests/fixtures/registry_consumer/Cargo.toml.template "$consumer/Cargo.toml"
          cp -R tests/fixtures/registry_consumer/src "$consumer/src"
          cp -R tests/fixtures/registry_consumer/tests "$consumer/tests"
          for attempt in $(seq 1 18); do
            if CARGO_TARGET_DIR="$RUNNER_TEMP/registry-consumer-target" cargo +stable test --manifest-path "$consumer/Cargo.toml"; then
              exit 0
            fi
            echo "Registry consumer not ready (attempt $attempt of 18)" >&2
            sleep 10
          done
          exit 1

      - name: Tag the verified commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          git fetch origin --tags
          if git rev-parse --quiet --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            test "$(git rev-parse "v$RELEASE_VERSION^{commit}")" = "$RELEASE_SHA"
          fi
          if ! gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --target "$RELEASE_SHA" --title "archunit v$RELEASE_VERSION" --generate-notes
          fi
