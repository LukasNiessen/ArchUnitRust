[package]
name = "archunit"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Architecture testing for Rust"
repository = "https://github.com/LukasNiessen/ArchUnitRust"
documentation = "https://lukasniessen.github.io/ArchUnitRust/api/archunit/"
license = "MIT"
readme = "README.md"
keywords = ["architecture", "testing", "dependencies", "static-analysis"]
categories = ["development-tools::testing"]
exclude = ["docs/assets/og.png"]

[lib]
path = "src/lib.rs"

[dependencies]
cargo_metadata = "0.20"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
regex = "1.11"
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
