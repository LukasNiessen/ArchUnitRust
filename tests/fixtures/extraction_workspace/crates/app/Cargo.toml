[package]
name = "fixture-app"
version.workspace = true
edition.workspace = true
build = "build/custom.rs"

[lib]
path = "source/library.rs"

[[bin]]
name = "fixture-server"
path = "cmd/server.rs"

[[test]]
name = "architecture"
path = "qa/architecture.rs"

[[example]]
name = "demo"
path = "samples/demo.rs"

[[bench]]
name = "speed"
path = "perf/speed.rs"
harness = false

[dependencies]
macro-tools = { package = "fixture-macros", path = "../macros" }
tokio = "1"
wire-format = { package = "serde", version = "1" }

[dev-dependencies]
dev-only = { package = "pretty_assertions", version = "1" }

[build-dependencies]
build-only = { package = "cc", version = "1" }
